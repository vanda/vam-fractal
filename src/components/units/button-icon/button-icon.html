<div class="fr-button-icon">
{% if icons %}

  {% for icon in icons %}
  <button class="u-btn-icon {% for m in modifiers %} u-btn-icon--{{ m }}{% endfor %} u-btn-icon--{{ icon }}" title="{{ title }}">{{ title }}</button>
  {% endfor %}

{% else %}

<!-- custom icon button example has example styles set in fractal preview styles -->
<button class="u-btn-icon fr-custom-icon-button-eg" title="Descriptive button label">
  Descriptive button label
</button>

{% endif %}
</div>
